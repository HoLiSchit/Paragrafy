version: '3.8'

services:
  paragrafy-app:
    build: .
    container_name: paragrafy_saas
    restart: always
    ports:
      - "5555:80"
    volumes:
      # Persistiert SQLite-Datenbank, config.php, Backups und .env.local auf dem Host.
      # Ohne dieses Volume gehen Datenbank & Zugangsdaten bei jedem Rebuild verloren!
      - ./data:/var/www/html/data
    environment:
      - PARAGRAFY_DATA_DIR=/var/www/html/data